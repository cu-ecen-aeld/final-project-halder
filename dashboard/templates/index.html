<!DOCTYPE html>
<html>

<head>
    <title>Raspberry Pi System Monitor</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }

        h1 {
            font-size: 24px;
        }

        h2 {
            margin-bottom: 10px;
        }

        .status {
            background: white;
            padding: 12px 16px;
            margin: 20px 0;
            border-radius: 8px;
        }

        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .chart-container {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-sizing: border-box;
            height: 300px;
        }

        .chart-container.temperature {
            grid-column: 1 / 3;
            height: 350px;
        }

        .chart-container canvas {
            width: 100% !important;
            height: 100% !important;
        }

        .table-container {
            background: white;
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 8px 12px;
            text-align: right;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #eee;
        }

        th:first-child,
        td:first-child {
            text-align: left;
        }
    </style>
</head>

<body>
    <h1>CU Boulder ECEA 5307 Final Project: Embedded System Monitoring WebApp</h1>
    
    <div class="status">
        <strong>Hostname:</strong>
        <span id="hostname">--</span>
        &nbsp; | &nbsp;
        <strong>Uptime:</strong>
        <span id="uptime">--</span>
    </div>

    <div class="charts">
        <div class="chart-container temperature">
            <h2>CPU Temperature</h2>
            <canvas id="temperature-chart"></canvas>
        </div>

        <div class="chart-container">
            <h2>Memory Usage</h2>
            <canvas id="memory-chart"></canvas>
        </div>

        <div class="chart-container">
            <h2>CPU Frequency</h2>
            <canvas id="frequency-chart"></canvas>
        </div>
    </div> 
    
    <div class="table-container">
        <h2>Recent Measurements</h2>

        <table>
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>Memory In Use (%)</th>
                    <th>Free Memory (MiB)</th>
                    <th>CPU Temperature (°C)</th>
                    <th>CPU Frequency (MHz)</th>
                </tr>
            </thead>

            <tbody id="data-table">
            </tbody>
        </table>
    </div>


    <script>
        let temperatureChart;
        let memoryChart;
        let frequencyChart;

        function formatUptime(seconds) {
            const hours = Math.floor(seconds / 3600);
            seconds %= 3600;

            const minutes = Math.floor(seconds / 60);
            seconds %= 60;

            return `${hours} hours ${minutes} minutes ${seconds} seconds`
        }

        function formatTimestamp(timestamp) {
            const date = new Date(timestamp);

            if (isNaN(date)) {
                return timestamp;
            }

            return date.toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            });
        }

        function createCharts() {
            temperatureChart = new Chart(
                document.getElementById("temperature-chart"),
                {
                    type: "line",
                    data: {
                        labels: [],
                        datasets: [{
                            label: "CPU Temperature (°C)",
                            data: [],
                            borderColor: "red",
                            backgroundColor: "rgba(255, 0, 0, 0.1)",
                            borderWidth: 2,
                            pointRadius: 2,
                            tension: 0.2,
                            fill: true
                        }]
                    },
                    options: {
                        animation: false,
                        responsive: true,
                        maintainAspectRatio: false,

                        scales: {
                            y: {
                                title: {
                                    display: true,
                                    text: "Temperature (°C)"
                                }
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: "Time"
                                }
                            }
                        }
                    }
                }
            );

            memoryChart = new Chart(
                document.getElementById("memory-chart"),
                {
                    type: "line",
                    data: {
                        labels: [],
                        datasets: [{
                            label: "Memory in use (%)",
                            data: [],
                            borderColor: "blue",
                            backgroundColor: "rgba(0, 0, 255, 0.1)",
                            borderWidth: 2,
                            pointRadius: 2,
                            tension: 0.2,
                            fill: true
                        }]
                    },
                    options: {
                        animation: false,
                        responsive: true,
                        maintainAspectRatio: false,

                        scales: {
                            y: {
                                title: {
                                    display: true,
                                    text: "Memory Usage (%)"
                                }
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: "Time"
                                }
                            }
                        }
                    }
                }
            );
            
            frequencyChart = new Chart(
                document.getElementById("frequency-chart"),
                {
                    type: "line",
                    data: {
                        labels: [],
                        datasets: [{
                            label: "CPU Frequency (MHz)",
                            data: [],
                            borderColor: "green",
                            backgroundColor: "rgba(0, 128, 0, 0.1)",
                            borderWidth: 2,
                            pointRadius: 2,
                            tension: 0.2,
                            fill: true
                        }]
                    },
                    options: {
                        animation: false,
                        responsive: true,
                        maintainAspectRatio: false,

                        scales: {
                            y: {
                                title: {
                                    display: true,
                                    text: "Frequency (MHz)"
                                }
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: "Time"
                                }
                            }
                        }
                    }
                }
            );

        }

        async function updateDashboard() {
            const response = await fetch("/api/data");
            if (!response.ok) {
                throw new Error(`HTTP error: ${response.status}`);
            }

            const data = await response.json();
            if (data.length === 0) {
                return;
            }

            const latest = data[data.length - 1];

            document.getElementById("hostname").textContent = latest.hostname;
            document.getElementById("uptime").textContent = formatUptime(latest.uptime_seconds);

           
            const table = document.getElementById("data-table");
            // Clear existing rows
            table.innerHTML = "";

            // Last entry is newest, so iterate backwards
            const recentEntries = data.slice(-10).reverse();

            for (const entry of recentEntries) {
                const row = table.insertRow();

                row.insertCell().textContent = formatTimestamp(entry.timestamp);
                row.insertCell().textContent = entry.memory_in_use.toFixed(2);
                row.insertCell().textContent = entry.free_memory_mib.toFixed(2);
                row.insertCell().textContent = entry.cpu_temp_celsius.toFixed(2);
                row.insertCell().textContent = entry.cpu_freq_mhz.toFixed(2);
            }

            const labels = data.map(entry => formatTimestamp(entry.timestamp));

            temperatureChart.data.labels = labels;
            temperatureChart.data.datasets[0].data = data.map(entry => entry.cpu_temp_celsius);

            const memoryValues = data.map(entry => entry.memory_in_use);

            const minMemory = Math.min(...memoryValues);
            const maxMemory = Math.max(...memoryValues);
            const padding = 2;

            memoryChart.data.labels = labels;
            memoryChart.data.datasets[0].data = data.map(entry => entry.memory_in_use);
            memoryChart.options.scales.y.min = Math.max(0, minMemory - padding);
            memoryChart.options.scales.y.max = Math.min(100, maxMemory + padding);

            frequencyChart.data.labels = labels;
            frequencyChart.data.datasets[0].data = data.map(entry => entry.cpu_freq_mhz);

            temperatureChart.update();
            memoryChart.update();
            frequencyChart.update();
        }

        createCharts();
        updateDashboard();
        setInterval(updateDashboard, 1000);
    </script>
</body>

</html>
